# --------------------------------------
# Hexo Butterfly Theme Configuration
# If you have any questions, please refer to the documentation
# Chinese: https://butterfly.js.org/
# English: https://butterfly.js.org/en/
# --------------------------------------

# --------------------------------------
# Navigation Settings
# --------------------------------------

nav:
  # Navigation bar logo image
  logo: http://117.72.81.48/i/2025/01/12/6783e09e6bd8f.png
  display_title: true
  # Whether to fix navigation bar
  fixed: false

menu:
  首页: / || fas fa-home
  历史: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder-open
  链接||fas fa-list:
    个人音乐: /music/ || fas fa-music
    个人视频: /movies/ || fas fa-video
  来找我聊天: http://117.72.81.48:5200 || fas fa-heart



# --------------------------------------
# Code Blocks Settings
# --------------------------------------

code_blocks:
  # 代码块主题：darker / pale night / light / ocean / false
  theme: light
  # 是否启用 Mac 风格
  macStyle: true
  # 代码块高度限制（单位：px）
  height_limit: false
  # 是否启用自动换行
  word_wrap: false

    # Toolbar
  # 是否启用复制按钮
  copy: true
  # 是否启用语言选择按钮
  language: true
  # true: 收缩代码块 | false: 展开代码块 | none: 展开代码块并隐藏按钮
  shrink: false
  # 是否启用全屏按钮
  fullpage: false


# Social media links
# Formal:
#   icon: link || the description || color
social:
  fa-brands fa-qq: https://qm.qq.com/cgi-bin/qm/qr?k=GAygZaaB8kDwDkj9N5xeoMbZxPIYPirE&jump_from=webapi&authKey=Wl+oZrXFkWuSbbLEfhovChZzk7g/f9Imj9idss1T6rwqFwXeuI+e4EOrlFBqto+X"><img border="0" src="//pub.idqqimg.com/wpa/images/group.png" alt="提瓦特的奇妙冒险" title="提瓦特的奇妙冒险" || 来找我 || "#74C0FC"
  fa-brands fa-bilibili: https://space.bilibili.com/391457000?spm_id_from=333.788.0.0 || bilibili || "#74C0FC"
# --------------------------------------
# Image Settings
# --------------------------------------

  favicon: http://117.72.81.48/i/2025/01/12/6783d55a94349.png

avatar:
  img: http://117.72.81.48/i/2025/01/13/678482fdb5a5d.jpg
  effect: false

  # 禁用所有顶部图片
disable_top_img: false

# 如果页面的横幅未设置，它将显示默认的顶部图片
default_top_img: transparent

# 索引页面的横幅图片
index_img:

# 存档页面的横幅图片
archive_img:

# 注意：标签页面，而不是标签页面
tag_img:

# 标签页面的横幅图片，您可以为每个标签设置横幅图片
# 格式：
#  - 标签名称: xxxxx
# 标签图片设置
# 格式：
#  - 标签名称: xxxxx
tag_per_img:

# 注意：分类页面，而不是分类页面
category_img:

# 分类页面的横幅图片，您可以为每个分类设置横幅图片
# 格式：
#  - 分类名称: xxxxx
category_per_img:

# 页脚的背景图片
footer_img: transparent

# 网站背景
# 可以设置为颜色或图片 URL
background: http://117.72.81.48/i/2025/01/13/678488b9f0f07.png

cover:
  # 是否禁用封面
  index_enable: true
  aside_enable: true
  archives_enable: true
  # 当封面未设置时，显示默认封面

# Replace Broken Images
error_img:
  flink: /img/friend_404.gif
  post_page: /img/404.jpg

# A simple 404 page
error_404:
  enable: true
  subtitle: '你好，迷路的旅人'
  background: /img/error-page.png

post_meta:
  # 页面设置
  page:
    # 日期类型选择：created（创建日期）/ updated（更新日期）/ both（两者都显示）
    date_type: created
    # 日期格式选择：date（日期格式）/ relative（相对时间格式）
    date_format: date
    # 是否显示分类
    categories: true
    # 是否显示标签
    tags: false
    # 是否显示标签
    label: true

  # 文章设置
  post:
    # 日期位置选择：left（左）/ center（中）
    position: left
    # 日期类型选择：created（创建日期）/ updated（更新日期）/ both（两者都显示）
    date_type: both
    # 日期格式选择：date（日期格式）/ relative（相对时间格式）
    date_format: date
    # 是否显示分类
    categories: true
    # 是否显示标签
    tags: true
    # 是否显示标签
    label: true

# --------------------------------------
# Index page settings
# --------------------------------------

# The top_img settings of home page
# default: top img - full screen, site info - middle
# The position of site info, eg: 300px/300em/300rem/10%
index_site_info_top:
# The height of top_img, eg: 300px/300em/300rem
index_top_img_height:

# The subtitle on homepage
subtitle:
  # 是否启用副标题
  enable: true
  # 是否启用打字机效果
  effect: true
  # 自定义 typed.js
  # https://github.com/mattboldt/typed.js/#customization
  typed_option:
  # 来源 - 调用第三方服务 API（仅支持中文）
  # 它将首先显示来源，然后显示 sub 的内容
  # 选择：false/1/2/3
  # false - 禁用该功能
  # 1 - hitokoto.cn
  # 2 - yijuzhan.com
  # 3 - jinrishici.com
  source: 3
  sub:
  # 如果关闭打字机效果，副标题将只显示 sub 的第一行


# Article layout on the homepage
# 1: Cover on the left, info on the right
# 2: Cover on the right, info on the left
# 3: Cover and info alternate between left and right
# 4: Cover on top, info on the bottom
# 5: Info displayed on the cover
# 6: Masonry layout - Cover on top, info on the bottom
# 7: Masonry layout - Info displayed on the cover
index_layout: 3

# Display the article introduction on homepage
# 1: description
# 2: both (if the description exists, it will show description, or show the auto_excerpt)
# 3: auto_excerpt (default)
# false: do not show the article introduction
index_post_content:
  method: 3
  # If you set method to 2 or 3, the length need to config
  length: 500

# --------------------------------------
# Post Settings
# --------------------------------------

toc:
  post: true
  page: false
  number: true
  expand: true
  # Only for post
  style_simple: false
  scroll_percent: true

post_copyright:
  enable: true
  decode: false
  author_href:
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# Sponsor/reward
reward:
  enable: false
  text:
  QR_code:
    # - img: /img/wechat.jpg
    #   link:
    #   text: wechat
    # - img: /img/alipay.jpg
    #   link:
    #   text: alipay

# Post edit
# Easily browse and edit blog source code online.
post_edit:
  enable: false
  # url: https://github.com/user-name/repo-name/edit/branch-name/subdirectory-name/
  # For example: https://github.com/jerryc127/butterfly.js.org/edit/main/source/
  url:

# Related Articles
related_post:
  enable: false
  # Number of posts displayed
  limit: 6
  # Choose: created / updated
  date_type: created

# Choose: 1 / 2 / false
# 1: The 'next post' will link to old post
# 2: The 'next post' will link to new post
# false: disable pagination
post_pagination: 2

# Displays outdated notice for a post
noticeOutdate:
  enable: true
  # Style: simple / flat
  style: flat
  # When will it be shown
  limit_day: 30
  # Position: top / bottom
  position: top
  message_prev: 该文章上次更新于
  message_next: 天前，文章内容可能已过时，请以最新内容为准。

# --------------------------------------
# Footer Settings
# --------------------------------------
footer:
  # 是否显示网站所有者信息
  owner:
    enable: true
    # 网站创建年份
    since: 2025
  # 自定义文本
  custom_text: 想要来找我吗？<br> <a href="https://space.bilibili.com/391457000?spm_id_from=333.788.0.0" target="_blank"><img  align=center src="https://img.shields.io/badge/bilibili-b站-%23f416ff8b?style=flat"/></a>
  # 是否显示主题和框架的版权信息
  copyright: true


# --------------------------------------
# Aside Settings
# --------------------------------------

aside:
  enable: true
  hide: false
    # 是否显示按钮
  button: true
  # 是否在移动设备上显示
  mobile: true
  # 位置：左/右
  position: right
  # 显示：
  display:
    # 是否显示归档
    archive: true
    # 是否显示标签
    tag: true
    # 是否显示分类
    category: true
  # 作者卡片：
  card_author:
    # 是否启用
    enable: true
    # 描述
    description: 以此纪念我的时光
    # 按钮：
    button:
      # 是否启用
      enable: true
      # 图标
      icon: fab fa-github
      # 文本
      text: Github
      # 链接
      link: https://github.com/great-xiaoyi
  # 公告卡片：
  card_announcement:
    # 是否启用
    enable: true
    # 内容
    content: 旧游无处不堪寻，<br>别时容易见时难。<br>绿竹入幽径，<br>最是其中慢。
  # 最近文章卡片：
  card_recent_post:
    # 是否启用
    enable: true
    # 如果设置为0，将显示所有
    limit: 5
    # 排序：日期/更新
    sort: date
    # 排序顺序：
    sort_order:
  # 最新评论卡片：
  card_newest_comments:
    # 是否启用
    enable: false
    # 排序顺序：
    sort_order:
    # 限制：
    limit: 6
    # 单位：分钟，将数据保存到本地存储
    storage: 10
    # 是否显示头像
    avatar: true
  # 分类卡片：
  card_categories:
    # 是否启用
    enable: true
    # 如果设置为0，将显示所有
    limit: 8
    # 选择：无/真/假
    expand: none
    # 排序顺序：
    sort_order:
  # 标签卡片：
  card_tags:
    # 是否启用
    enable: false
    # 如果设置为0，将显示所有
    limit: 40
    # 是否显示颜色
    color: false
    # 标签顺序，随机/名称/长度
    orderby: random
    # 排序顺序。1，升序；-1，降序
    order: 1
    # 排序顺序：
    sort_order:
  # 归档卡片：
  card_archives:
    # 是否启用
    enable: true
    # 类型：月度/年度
    type: monthly
    # 例如：YYYY年MM月
    format: MMMM YYYY
    # 排序顺序。1，升序；-1，降序
    order: -1
    # 如果设置为0，将显示所有
    limit: 8
    # 排序顺序：
    sort_order:
  # 文章系列卡片：
  card_post_series:
    # 是否启用
    enable: false
    # 标题显示系列名称
    series_title: false
    # 按标题或日期排序
    orderBy: 'date'
    # 排序顺序。1，升序；-1，降序
    order: -1
  # 网站信息卡片：
  card_webinfo:
    # 是否启用
    enable: true
    # 文章数量
    post_count: true
    # 最后推送日期
    last_push_date: true
    # 排序顺序：
    sort_order:
    # 发布日期与现在的时间差
    # 正式：月/日/年 时间 或 年/月/日 时间
    # 如果不启用此功能，请留空
    runtime_date: 2025/1/12/15:39

  # --------------------------------------
  # 右下角按钮
  # --------------------------------------

  # 右下角按钮距离底部的距离（默认单位：px）
  rightside_bottom:

  # 繁简转换


# --------------------------------------
# Bottom right button
# --------------------------------------

# 右下角按钮距离底部的距离（默认单位：px）
rightside_bottom:

# 繁简转换
translate:
  # 是否启用繁简转换功能
  enable: false
  # 按钮的默认文本
  default: 繁
  # 网站的语言（1 - 繁体中文/ 2 - 简体中文）
  defaultEncoding: 2
  # 延迟时间
  translateDelay: 0
  # 语言为简体中文时按钮的文本
  msgToTraditionalChinese: '繁'
  # 语言为繁体中文时按钮的文本
  msgToSimplifiedChinese: '簡'

# Read Mode
readmode: true

# Dark Mode
darkmode:
  enable: true
  # Toggle Button to switch dark/light mode
  button: true
  # Switch dark/light mode automatically
  # autoChangeMode: 1  Following System Settings, if the system doesn't support dark mode, it will switch dark mode between 6 pm to 6 am
  # autoChangeMode: 2  Switch dark mode between 6 pm to 6 am
  # autoChangeMode: false
  autoChangeMode: 2
  # Set the light mode time. The value is between 0 and 24. If not set, the default value is 6 and 18
  start:
  end:

# 在返回顶部按钮中显示滚动百分比
rightside_scroll_percent: true

# 除非你知道这些设置是如何工作的，否则不要修改以下设置
# 选择：readmode,translate,darkmode,hideAside,toc,chat,comment
# 不要重复相同的值
rightside_item_order:
  enable: false
  # 默认：readmode,translate,darkmode,hideAside
  hide:
  # 默认：toc,chat,comment
  show:


# --------------------------------------
# Global Settings
# --------------------------------------

# 锚点：
# 当你滚动时，URL 将根据标题 ID 更新。
anchor:
  # 滚动时自动更新 URL
  auto_update: false
  # 点击标题滚动并更新锚点
  click_to_scroll: false

# 图片说明：
photofigcaption: false

# 复制：
copy:
  # 是否启用复制功能
  enable: true
  # 复制内容后添加版权信息
  copyright:
    # 是否启用版权信息
    enable: true
    # 限制字数
    limit_count: 150

# 需要安装 hexo-wordcount 插件
wordcount:
  # 是否启用字数统计
  enable: false
  # 在文章元数据中显示文章字数
  post_wordcount: true
  # 在文章元数据中显示阅读时间
  min2read: true
  # 在侧边栏的网站信息中显示网站总字数
  total_wordcount: true

# 不蒜子计数，用于统计网站的 PV / UV
busuanzi:
  # 是否启用网站 UV 统计
  site_uv: true
  # 是否启用网站 PV 统计
  site_pv: true
  # 是否启用页面 PV 统计
  page_pv: true

# --------------------------------------
# 数学公式
# --------------------------------------

# 关于 per_page 的设置
# 如果你将其设置为 true，它将在每个页面加载 mathjax/katex 脚本
# 如果你将其设置为 false，它将根据你的设置加载 mathjax/katex 脚本（在页面的 front-matter 中添加 'mathjax: true' 或 'katex: true'）
math:
  # 选择：mathjax, katex
  # 如果你不需要数学公式，可以留空
  use:
  # 是否在每页加载 mathjax/katex 脚本
  per_page: true
  # 是否隐藏滚动条
  hide_scrollbar: false

  mathjax:
    # 是否启用上下文菜单
    enableMenu: true
    # 选择：all / ams / none，这控制方程是否编号以及如何编号
    tags: none

  katex:
    # 是否启用复制 KaTeX 公式
    copy_tex: false

# --------------------------------------
# 搜索
# --------------------------------------

search:
  # 选择：algolia_search / local_search / docsearch
  # 如果你不需要搜索，可以留空
  use: local_search
  # 占位符
  placeholder: 你想找什么呢？

  # Algolia 搜索
  algolia_search:
    # 每页搜索结果数量
    hitsPerPage: 6

  # 本地搜索
  local_search:
    # 页面加载时预加载搜索数据
    preload: false
    # 每篇文章显示前 n 个结果，设置为 -1 显示所有结果
    top_n_per_article: 1
    # 将 HTML 字符串转换为可读的字符串
    unescape: false
    # CDN
    CDN:

  # Docsearch
  # https://docsearch.algolia.com/
  docsearch:
    # 应用 ID
    appId:
    # API 密钥
    apiKey:
    # 索引名称
    indexName:
    # 选项
    option:

# --------------------------------------
# Share System
# --------------------------------------

# 分享：
# 选择：sharejs / addtoany
# 如果你不需要分享，可以留空
share:
  # 选择分享服务
  use: sharejs

  # Share.js
  # https://github.com/overtrue/share.js
  sharejs:
    # 分享的网站
    sites: facebook,twitter,wechat,weibo,qq

  # AddToAny
  # https://www.addtoany.com/
  addtoany:
    # 分享的项目
    item: facebook,twitter,wechat,sina_weibo,facebook_messenger,email,copy_link

# --------------------------------------
# 评论系统
# --------------------------------------

comments:
  # 最多两个评论系统，第一个将被显示为默认
  # 如果你不需要评论，可以留空
  # 选择：Disqus/Disqusjs/Livere/Gitalk/Valine/Waline/Utterances/Facebook Comments/Twikoo/Giscus/Remark42/Artalk
  # 两个评论系统的格式：Disqus,Waline
  use: livere
  # 在按钮旁边显示评论名称
  text: true
  # 懒加载：当评论元素进入浏览器的视口时，评论系统才会加载。
  # 如果你将其设置为 true，评论计数将无效
  lazyload: false
  # 在文章的 top_img 中显示评论计数
  count: false
  # 在主页显示评论计数
  card_post_count: false

# Disqus
# https://disqus.com/
disqus:
  # Disqus 的短名称
  shortname:
  # 对于最新评论小部件
  apikey:

# 替代 Disqus - 使用 Disqus API 渲染评论
# https://github.com/SukkaW/DisqusJS
disqusjs:
  # Disqus 的短名称
  shortname:
  # Disqus 的 API 密钥
  apikey:
  # 选项
  option:

# Livere
# https://www.livere.com/
livere:
  # Livere 的 UID
  uid: MTAyMC82MDM2My8zNjgzMw

# Gitalk
# https://github.com/gitalk/gitalk
gitalk:
  # GitHub 应用的客户端 ID
  client_id:
  # GitHub 应用的客户端密钥
  client_secret:
  # 存储评论的 GitHub 仓库
  repo:
  # 仓库的所有者
  owner:
  # 管理员
  admin:
  # 选项
  option:

# Valine
# https://valine.js.org
valine:
  # LeanCloud 应用的 App ID
  appId: w5Lxl2Bp6tTYxqyCNu2Ygapl-gzGzoHsz
  # LeanCloud 应用的 App Key
  appKey: 4eE4HLwHj1RDnLqLwiemRA3F
  # 头像
  avatar: monsterid
  # 此配置适用于国内自定义域名用户，海外版本将自动检测（无需手动填写）
  serverURLs:
  # 背景
  bg:
  # 使用 Valine 访客计数作为页面浏览量
  visitor: true
  # 选项
  option:

# Waline - 一个简单的评论系统，支持后端，从 Valine 分支
# https://waline.js.org/
waline:
  # 服务器 URL
  serverURL:
  # 背景
  bg:
  # 使用 Waline 页面浏览量作为页面浏览量
  pageview: false
  # 选项
  option:

# Utterances
# https://utteranc.es/
utterances:
  # 存储库
  repo:
  # 问题映射：pathname/url/title/og:title
  issue_term: pathname
  # 主题：github-light/github-dark/github-dark-orange/icy-dark/dark-blue/photon-dark
  light_theme: github-light
  dark_theme: photon-dark
  # JavaScript
  js:
  # 选项
  option:

# Facebook Comments Plugin
# https://developers.facebook.com/docs/plugins/comments/
facebook_comments:
  # 应用 ID
  app_id:
  # 可选
  user_id:
  # 页面大小
  pageSize: 10
  # 选择：social / time / reverse_time
  order_by: social
  # 语言
  lang: en_US

# Twikoo
# https://github.com/imaegoo/twikoo
twikoo:
  # 环境 ID
  envId:
  # 区域
  region:
  # 使用 Twikoo 访客计数作为页面浏览量
  visitor: false
  # 选项
  option:

# Giscus
# https://giscus.app/
giscus:
  # 存储库
  repo:
  # 存储库 ID
  repo_id:
  # 类别 ID
  category_id:
  # 浅色主题
  light_theme: light
