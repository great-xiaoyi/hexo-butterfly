# Hexo 配置
## 文档：https://hexo.io/docs/configuration.html
## 源码：https://github.com/hexojs/hexo/

# 站点
title: 阿易的小窝 # 网站标题
subtitle: '' # 网站副标题
description: '' # 网站描述
keywords: # 网站关键词
author: John Doe # 作者姓名
language: zn-cn # 网站语言
timezone: '' # 时区

# URL
## 在这里设置你的站点 URL。例如，如果你使用 GitHub Page，设置 url 为 'https://username.github.io/project'
url: http://example.com # 网站 URL
permalink: :year/:month/:day/:title/ # 文章永久链接格式
permalink_defaults: # 永久链接默认值
pretty_urls: # 美化 URL
  trailing_index: true # 设置为 false 以从永久链接中删除尾随的 'index.html'
  trailing_html: true # 设置为 false 以从永久链接中删除尾随的 '.html'
# 目录
source_dir: source # 源文件目录
public_dir: public # 公共文件目录
tag_dir: tags # 标签目录
archive_dir: archives # 归档目录
category_dir: categories # 分类目录
code_dir: downloads/code # 代码目录
i18n_dir: :lang # 国际化目录
skip_render: # 跳过渲染的文件或目录

# 写作
new_post_name: :title.md # 新文章的文件名
default_layout: post # 默认布局
titlecase: false # 将标题转换为标题格式
external_link: # 外部链接
  enable: true # 在新标签页中打开外部链接
  field: site # 应用于整个站点
  exclude: '' # 排除的链接
filename_case: 0 # 文件名大小写
render_drafts: false # 渲染草稿
post_asset_folder: false # 文章资源文件夹
relative_link: false # 相对链接
future: true # 允许未来日期的文章
syntax_highlighter: highlight.js # 代码高亮器
highlight: # 代码高亮设置
  line_number: true # 显示行号
  auto_detect: false # 自动检测语言
  tab_replace: '' # 制表符替换
  wrap: true # 自动换行
  hljs: false # 使用 highlight.js
prismjs: # prism.js 设置
  preprocess: true # 预处理
  line_number: true # 显示行号
  tab_replace: '' # 制表符替换

# 主页设置
# path: 博客索引页面的根路径。（默认 = ''）
# per_page: 每页显示的文章数。（0 = 禁用分页）
# order_by: 文章排序方式。（默认按日期降序排列）
index_generator: # 索引生成器
  path: '' # 路径
  per_page: 10 # 每页文章数
  order_by: -date # 排序方式

# 分类和标签
default_category: uncategorized # 默认分类
category_map: # 分类映射
tag_map: # 标签映射

# 元数据元素
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true # 元数据生成器

# 日期和时间格式
## Hexo 使用 Moment.js 来解析和显示日期
## 你可以自定义日期格式，如
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD # 日期格式
time_format: HH:mm:ss # 时间格式
## updated_option 支持 'mtime', 'date', 'empty'
updated_option: 'mtime' # 更新选项

# 分页
## 设置 per_page 为 0 以禁用分页
per_page: 10 # 每页文章数
pagination_dir: page # 分页目录

# 包含/排除文件
## include:/exclude: 选项仅适用于 'source/' 文件夹
include: # 包含的文件或目录
exclude: # 排除的文件或目录
ignore: # 忽略的文件或目录

# 扩展
## 插件：https://hexo.io/plugins/
## 主题：https://hexo.io/themes/
theme: butterfly # 主题

# 部署
## 文档：https://hexo.io/docs/one-command-deployment
deploy: # 部署设置
  type: git # 部署类型
  repository: zjh@103.112.96.73:/home/git/blog.git # 仓库地址
  branch: master # 分支
